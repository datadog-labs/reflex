[package]
name = "reflex-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Deterministic circuit-breaking scenarios and an offline HTML laboratory"

[features]
default = []
# Application exporters only; the core Reflex crates remain exporter-independent.
datadog = ["dep:reqwest-otel", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-appender-tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]

[dependencies]
reqwest.workspace = true
reflex.workspace = true
reflex-typesafe = { path = "../reflex-typesafe" }
typesafe-ai.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
tracing = "0.1"
pin-project-lite = "0.2"

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }


# Direct Datadog OTLP export, enabled only for the playground's datadog feature.
reqwest-otel = { package = "reqwest", version = "0.13", default-features = false, features = ["blocking", "rustls"], optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "metrics", "trace", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { version = "0.3", features = ["registry"], optional = true }

[dev-dependencies]
# Match the HTTP client used by the OpenTelemetry exporters.
reqwest-otel = { package = "reqwest", version = "0.13", default-features = false, features = ["blocking", "rustls"] }

opentelemetry_sdk = { version = "0.33", features = ["testing"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "metrics", "trace", "logs"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["registry"] }
