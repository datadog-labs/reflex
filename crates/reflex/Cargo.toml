[package]
name = "reflex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Typed model recommendations and guarded state-machine execution"

[dependencies]
tokio.workspace = true
thiserror.workspace = true
futures-util.workspace = true
reflex-macros.workspace = true
tracing = "0.1"
pin-project-lite = "0.2"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
trybuild = "1"

opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["registry"] }
